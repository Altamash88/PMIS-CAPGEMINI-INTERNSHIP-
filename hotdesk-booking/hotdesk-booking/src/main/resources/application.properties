spring.application.name=hotdesk-booking

# Console app: no web server, no banner, quiet logs so the menu stays clean
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# ---- MySQL connection (override with environment variables if needed) ----
# The database "hotdesk_db" is created automatically on first run.
app.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
app.datasource.username=${DB_USER:root}
app.datasource.password=${DB_PASSWORD:altamash}

# ---- Run schema.sql then data.sql on every start (both are idempotent) ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
